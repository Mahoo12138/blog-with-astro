- id: 01-morning-eyes
  text: "你是我每天睁开眼睛最想见到的人。"
- id: 02-sleepless
  text: "有你陪着的日子，连失眠都变得可爱了。"
- id: 03-best-time
  text: "谢谢你把最好的时光都给了我。"
- id: 04-next-life
  text: "下辈子，还要找到你。"
- id: 05-half-dusk
  text: "想把每个普通的黄昏都分你一半。"
- id: 06-one-smile
  text: "你一笑，我就觉得今天已经很好了。"
- id: 07-slow-walk
  text: "喜欢和你慢慢走，也喜欢和你突然奔跑。"
- id: 08-name-soft
  text: "你的名字，是我心里最柔软的开关。"
- id: 09-more-today
  text: "今天也有偷偷多喜欢你一点。"
